[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htmlreel"
version = "0.1.0"
description = "Narrated video from an HTML page that is a pure function of time"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Juan Rodrigo Vigil" }]
keywords = ["video", "html", "ffmpeg", "headless-chrome", "voice-over", "reproducible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/iarodrigovigil-cloud/htmlreel"
Issues = "https://github.com/iarodrigovigil-cloud/htmlreel/issues"

[project.scripts]
htmlreel = "htmlreel.__main__:main"

[tool.setuptools]
packages = ["htmlreel"]
